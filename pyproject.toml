[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mira-foundation"
version = "0.1.0"
description = "Inspectable canonical knowledge and rebuildable retrieval"
requires-python = ">=3.11"
dependencies = ["markdown-it-py>=3,<5"]

[project.scripts]
mira = "mira.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mira = ["viewer_assets/*.html", "viewer_assets/*.js", "viewer_assets/*.css"]

[tool.setuptools.data-files]
"share/mira/prompt_templates" = ["prompt_templates/*.txt", "prompt_templates/README.md"]
